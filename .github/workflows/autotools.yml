name: Autotools CI

on:
  push:
    branches: [master, main, feature/**, features/**]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
  # Enables triggering the workflow manually (on any branch) from the Actions tab
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-26
            name: macOS 26 arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # From the logs, it looks like the needed cache is a little over 8GB. jhrg 4/1/26
      CCACHE_MAXSIZE: 10G
      CCACHE_COMPRESS: "true"
      CMAKE_PRESET: ci
      # CMAKE_PRESET: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create ccache directory
        run: mkdir -p "$CCACHE_DIR"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-cmake-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '.github/workflows/cmake.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cmake-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev \
            libcurl4-openssl-dev \
            uuid-dev \
            libcppunit-dev \
            libtirpc-dev \
            libfl-dev \
            ccache

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install \
            bison \
            ccache \
            cppunit \
            flex \
            autoconf \
            automake \
            libtool

      - name: Configure macOS build environment
        if: runner.os == 'macOS'
        run: |
          BREW_PREFIX="$(brew --prefix)"
          echo "$BREW_PREFIX/opt/bison/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/opt/flex/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$BREW_PREFIX" >> "$GITHUB_ENV"

      - name: Information
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: |
          which bison
          bison --version
          which flex
          flex --version
          which ccache
          ccache --version
          which autoconf
          autoconf --version
          which automake
          automake --version

      - name: Determine parallelism
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "BUILD_JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
          else
            echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          fi

      - name: Configure
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: |
          ccache --zero-stats || true
          ccache --max-size "$CCACHE_MAXSIZE" || true

      - name: Build
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: |
          autoreconf --force --install --verbose
          ./configure --disable-dependency-tracking --prefix=${PWD}/build/install
          make -j$BUILD_JOBS

      - name: Install
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: |
          make install
          ls -laF ${PWD}/build/install/lib

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
